services:
  - type: web
    name: ecclessia-manager
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && npm install && npm run build:css && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && python manage.py ensure_admin && daphne -b 0.0.0.0 -p $PORT ecclessia_manager.asgi:application"
    envVars:
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        value: ecclessia_manager.settings
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: ecclessia-manager-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ecclessia-manager-redis
          property: connectionString

  - type: redis
    name: ecclessia-manager-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: ecclessia-manager-db
    plan: free
