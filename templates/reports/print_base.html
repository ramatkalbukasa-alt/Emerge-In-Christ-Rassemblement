<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ecclessia Manager{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --canvas: #F0F0F0;
      --ink: #121212;
      --red: #D02020;
      --blue: #1040C0;
      --yellow: #F0C020;
      --muted: #E0E0E0;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--canvas);
      color: var(--ink);
      font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
      font-weight: 500;
      line-height: 1.5;
      margin: 0;
      padding: 24px;
    }
    .sheet {
      background: #fff;
      border: 4px solid var(--ink);
      box-shadow: 8px 8px 0 0 var(--ink);
      margin: 0 auto;
      max-width: 1100px;
      padding: 32px;
    }
    .actions { display: flex; gap: 12px; margin: 0 auto 24px; max-width: 1100px; }
    .actions button {
      background: var(--red);
      border: 2px solid var(--ink);
      box-shadow: 4px 4px 0 0 var(--ink);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      min-height: 48px;
      padding: 10px 20px;
      text-transform: uppercase;
    }
    .actions button:active { box-shadow: none; transform: translate(2px, 2px); }
    .brand { align-items: center; display: flex; gap: 4px; margin-bottom: 20px; }
    .brand span { border: 2px solid var(--ink); display: block; height: 18px; width: 18px; }
    .brand .circle { background: var(--red); border-radius: 9999px; }
    .brand .square { background: var(--blue); }
    .brand .triangle { background: var(--yellow); border: 0; clip-path: polygon(50% 0, 0 100%, 100% 100%); }
    header { border-bottom: 4px solid var(--ink); margin-bottom: 24px; padding-bottom: 20px; }
    .kicker { color: var(--red); font-size: 12px; font-weight: 700; letter-spacing: 0.18em; margin: 0 0 8px; text-transform: uppercase; }
    h1 { font-size: 40px; font-weight: 900; letter-spacing: -0.03em; line-height: 0.95; margin: 0 0 12px; text-transform: uppercase; }
    h2 { border-left: 8px solid var(--blue); font-size: 18px; font-weight: 700; letter-spacing: 0.06em; margin: 28px 0 12px; padding-left: 12px; text-transform: uppercase; }
    h2:nth-of-type(2n) { border-left-color: var(--red); }
    h2:nth-of-type(3n) { border-left-color: var(--yellow); }
    header p { margin: 4px 0; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .meta span { border: 2px solid var(--ink); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; padding: 2px 8px; text-transform: uppercase; }
    .meta .fill-yellow { background: var(--yellow); }
    .meta .fill-blue { background: var(--blue); color: #fff; }
    table { border: 2px solid var(--ink); border-collapse: collapse; margin-bottom: 18px; width: 100%; }
    th, td { border: 2px solid var(--ink); font-variant-numeric: tabular-nums; padding: 10px 12px; text-align: left; }
    thead th { background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
    tbody th { background: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    tbody tr:nth-child(even) td { background: #FAFAFA; }
    .total th, .total td { background: var(--yellow); font-weight: 900; }
    .notes { border: 2px solid var(--ink); background: #FFF9C4; padding: 16px; }
    .note-history { background: var(--yellow); border: 2px solid var(--ink); display: inline-block; font-weight: 700; margin-top: 8px; padding: 6px 10px; }
    @media (max-width: 640px) {
      body { padding: 12px; }
      .sheet { border-width: 2px; box-shadow: 4px 4px 0 0 var(--ink); padding: 20px; }
      h1 { font-size: 30px; }
      .table-wrap { overflow-x: auto; }
    }
    @media print {
      body { background: #fff; padding: 0; }
      .sheet { border: 0; box-shadow: none; max-width: none; padding: 0; }
      .actions { display: none; }
      thead th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .total th, .total td, tbody th, .notes, .brand span, .meta span { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      tr { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="actions">
    <button type="button" onclick="window.print()">Imprimer</button>
  </div>
  <div class="sheet">
    <div class="brand" aria-hidden="true"><span class="circle"></span><span class="square"></span><span class="triangle"></span></div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
